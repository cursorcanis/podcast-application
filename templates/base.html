<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Podcast Foundry{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Podcast Foundry</h1>
    {% set path = request.url.path if request is defined else '' %}
    <nav class="main-nav" aria-label="Main menu">
      <a href="/" class="{{ 'active' if path == '/' }}">Status</a>
      <a href="/rendering" class="{{ 'active' if path.endswith('/render') or path == '/rendering' }}">
        {% if render_active() %}<span class="live-dot" title="A render is running"></span>{% endif %}Rendering</a>
      <a href="/episodes" class="{{ 'active' if path.startswith('/episodes') and path != '/episodes/new' and not path.endswith('/render') }}">Episode Library</a>
      <a href="/upload" class="{{ 'active' if path.startswith('/upload') }}">Upload Script</a>
      <a href="/episodes/new" class="{{ 'active' if path == '/episodes/new' }}">New Episode</a>
      <a href="/settings" class="{{ 'active' if path.startswith('/settings') }}">Settings</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="/static/status.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
